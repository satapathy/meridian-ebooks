[pytest]
testpaths = tests
# -v           one line per test (name + PASSED/FAILED)
# --cov        measure the app package; --cov-fail-under makes the run (and so the build) FAIL below 95 %
addopts = -v --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=95
filterwarnings =
    ignore::DeprecationWarning
