name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # pytest.ini adds -v (one line per test) and --cov-fail-under=95, so coverage below 95 % fails this job
      - run: python -m pytest
